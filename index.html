<!-- Página provisória: HTML e CSS num arquivo só, sem JavaScript. Os caminhos são
     todos relativos, para funcionar tanto em usuario.github.io/repositorio/ quanto
     no domínio próprio. Ver LEIAME.md. -->
<style>
/* Austin News, cortada para os glifos desta página (comando no LEIAME.md). */
@font-face { font-family: "Austin Headline"; src: url("fontes/headline-roman.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Austin Deck"; src: url("fontes/deck-roman.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Austin Text"; src: url("fontes/text-roman.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Austin Text"; src: url("fontes/text-no2-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; font-display: swap; }

/* Reservas: a Georgia, calçada com as métricas da Austin, para o logotipo e o
   rodapé não mudarem de largura enquanto a fonte chega. Os números são do
   estilo.css do sítio, onde estão derivados. */
@font-face { font-family: "Reserva Headline"; src: local("Georgia"); size-adjust: 87.385%; ascent-override: 102.9%; descent-override: 24.8%; line-gap-override: 0%; }
@font-face { font-family: "Reserva Text"; src: local("Georgia"); font-weight: 400; size-adjust: 104.919%; ascent-override: 90.74%; descent-override: 19.54%; line-gap-override: 0%; }
@font-face { font-family: "Reserva Text"; src: local("Georgia"); font-weight: 500; size-adjust: 106.770%; ascent-override: 89.16%; descent-override: 19.20%; line-gap-override: 0%; }

:root {
  --papel: #f4f4f4;
  --tinta: #1a1a1a;
  --tinta-media: #565656;
  --tinta-clara: #6e6e6e;
  --filete: #6e6e6e;
  --selecao: #d5d5d5;

  --margem: clamp(1.25rem, 4vw, 5rem);
  --sangria: 0.31983cqw;                       /* o filete avança além do texto */
  --corpo: clamp(1rem, 0.94rem + 0.28vw, 1.125rem);
  --pauta: calc(var(--corpo) * 1.6);
  --marca-fator: 4.690;                        /* largura do logotipo, em em */
  --nome: calc(100cqw / 28);                   /* o corpo dos nomes da capa */
  --text-x: calc(0.534 / 0.505);               /* altura de x da Austin Text */
  color-scheme: light;
}
@media (max-width: 68rem) {
  :root { --nome: clamp(1.6rem, 1.1rem + 2.1vw, 2.25rem); }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--papel);
  color: var(--tinta);
  font-family: "Austin Text", "Reserva Text", Georgia, serif;
  font-size: var(--corpo);
  line-height: 1.6;
  font-feature-settings: "kern", "liga";
}
::selection { background: var(--selecao); color: var(--tinta); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--tinta); outline-offset: 4px; border-radius: 0; }

/* A folha é o contêiner: 100cqw é a largura útil, sem a barra de rolagem. */
.folha {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 0 var(--margem) calc(2.5 * var(--pauta));
  container-type: inline-size;
  overflow-x: clip;
}

/* Cabeçalho: só o Contato, no canto, centrado no branco acima do logotipo. */
.topo {
  display: flex;
  justify-content: flex-end;
  margin: 0 calc(-1 * var(--sangria));
  padding: calc(0.75 * var(--pauta)) var(--sangria) 0;
}
.topo nav {
  display: flex;
  position: relative;
  top: max(0px, calc((3.889cqw - 0.75 * var(--pauta) + 3.4px) / 2));
}
.topo a {
  font-family: "Austin Text", "Reserva Text", Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 1rem;
  line-height: 1.4;
  color: var(--tinta-media);
  text-decoration: none;
  padding-bottom: 2px;
  border-bottom: 1px solid transparent;
}
.topo a:hover { color: var(--tinta); border-bottom-color: var(--tinta); }

/* O logotipo: o corpo é a largura útil dividida pela largura dele em em. */
.marca {
  margin: 0.07em 0 0;
  font-family: "Austin Headline", "Reserva Headline", Georgia, serif;
  font-weight: 400;
  font-size: calc((100vw - 2 * var(--margem)) / var(--marca-fator));
  font-size: calc(100cqw / var(--marca-fator));
  line-height: 0.92;
  letter-spacing: -0.005em;
  white-space: nowrap;
}
.marca .ponto { color: var(--tinta-media); }
.regua {
  margin: 0.02em calc(-1 * var(--sangria)) 0;
  border: 0;
  border-top: 2px solid var(--filete);
  font-size: calc(100cqw / var(--marca-fator));   /* o em é o do logotipo */
}

/* O aviso ocupa o lugar da linha de serviços da capa: Austin Deck, no corpo dos nomes. */
main { padding-bottom: calc(3 * var(--pauta)); }
.breve {
  margin: 1.1em 0 0;
  font-family: "Austin Deck", Georgia, serif;
  font-weight: 400;
  font-size: var(--nome);
  line-height: 1.1;
  letter-spacing: -0.008em;
}

/* Rodapé: colofão à esquerda, contatos à direita; desce até o pé da tela. */
.rodape {
  margin: auto calc(-1 * var(--sangria)) 0;
  padding: calc(0.75 * var(--pauta)) var(--sangria) 0;
  border-top: 2px solid var(--filete);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem 2rem;
  font-size: 0.875rem;
  line-height: 1.5;
  color: var(--tinta-clara);
}
.colofao {
  font-family: "Austin Text", "Reserva Text", Georgia, serif;
  font-size: calc(1em * var(--text-x));
  line-height: 1.4484;
  text-transform: lowercase;
}
.contato {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.3rem 1.25rem;
  font-family: "Austin Text", "Reserva Text", Georgia, serif;
  font-size: calc(1em * var(--text-x));
}
.contato a { color: var(--tinta-media); text-decoration: none; }
.contato a:hover { color: var(--tinta); }
.rotulo { border-bottom: 1px solid var(--filete); padding-bottom: 1px; transition: border-color 140ms ease; }
.contato a:hover .rotulo { border-bottom-color: var(--tinta); }

/* Os glifos oficiais da Meta, escalados e sem mais nada. */
.selo { width: 1.2em; height: 1.2em; vertical-align: calc(-0.218em - 2px); }
.selo-quadro { margin-left: 0.181em; }
.selo-balao { margin-left: 0.207em; }

@media (prefers-reduced-motion: reduce) { .rotulo { transition: none; } }
</style>
